name: Deploy a Hostinger (solo archivos web)

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      # Cache-busting: los assets (CSS/JS) se cachean 7 días en Hostinger.
      # El HTML NO se cachea, así que sellamos un número de versión único por
      # deploy en las refs ?v=__VER__ -> el navegador descarga el CSS/JS nuevo
      # al instante en cada deploy, sin esperar a que expire la caché.
      - name: Cache-busting (sellar versión en el HTML)
        run: |
          find . -path ./.git -prune -o -name '*.html' -print0 \
            | xargs -0 sed -i "s/__VER__/${{ github.run_number }}/g"
          echo "Sellado __VER__ -> ${{ github.run_number }}"

      - name: Subir SOLO los archivos web por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger es más estable por FTPS (FTP cifrado) que por FTP plano
          protocol: ftps
          port: 21
          timeout: 60000
          # La cuenta FTP dedicada (u316245944.NewSite) está encerrada (chroot)
          # directamente en /home/u316245944/domains/dentimagen.net/public_html
          # = el docroot REAL servido. Por eso server-dir es ./ (escribe ahí mismo,
          # sin navegar ni crear carpetas). La cuenta principal u316245944 NO podía
          # llegar a esta carpeta (estaba encerrada en otro public_html). 2026-05-24.
          server-dir: ./
          # Todo lo que NO debe subir al servidor:
          exclude: |
            **/.git*
            **/.git*/**
            _docs/**
            _scripts/**
            _mockups/**
            .github/**
            screenshots/**
            **/*.md
            .gitignore
            .htaccess-root
